name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/serene-johnson-49m1ip]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://gifthut.in
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
          NEXT_PUBLIC_ANALYTICS_ID: ${{ vars.ANALYTICS_ID }}
          NEXT_PUBLIC_NEWSLETTER_ENDPOINT: ${{ vars.NEWSLETTER_ENDPOINT }}
          NEXT_PUBLIC_LOCAL_PHOTOS: ${{ vars.LOCAL_PHOTOS }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
